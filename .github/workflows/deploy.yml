name: Build and deploy

on:
  # Re-run on every push to main
  push:
    branches: [main]
    # But skip when only docs/README change
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run multiple deploys in parallel
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PDF parsing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip3 install --break-system-packages pdfminer.six pypdf

      - name: Parse PDF to JSON
        if: hashFiles('data/2026-Michigan-Fishing-Regulations.pdf') != ''
        run: |
          python3 scripts/parse_pdf.py

      - name: Cache CHANGES-UM dataset
        id: cache-changes-um
        uses: actions/cache@v4
        with:
          path: /tmp/summ_fishc_grow.zip
          key: changes-um-v1.0.0

      - name: Download CHANGES-UM dataset
        if: steps.cache-changes-um.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/summ_fishc_grow.zip "https://zenodo.org/api/records/15389937/files/CHANGES-UM/summ_fishc_grow-v1.0.0.zip/content"

      - name: Map species by waterbody
        run: |
          pip3 install --break-system-packages fuzzywuzzy python-Levenshtein || pip3 install --break-system-packages fuzzywuzzy
          python3 scripts/map_species_by_waterbody.py --regs data/regs.json --survey-zip /tmp/summ_fishc_grow.zip --output public/data/species_by_waterbody.json --inject
          cp data/regs.json public/data/regs.json

      - name: Install npm dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
