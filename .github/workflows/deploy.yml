name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Bump this when the DNR releases a new annual PDF.
  REGS_YEAR: "2026"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip3 install --break-system-packages pdfminer.six pypdf rapidfuzz python-Levenshtein

      - name: Parse PDF to JSON
        if: hashFiles(format('data/{0}-Michigan-Fishing-Regulations.pdf', env.REGS_YEAR)) != ''
        run: |
          python3 scripts/parse_pdf.py

      - name: Cache CHANGES-UM dataset
        id: cache-changes-um
        uses: actions/cache@v4
        with:
          path: /tmp/summ_fishc_grow.zip
          key: changes-um-v1.0.0

      - name: Download CHANGES-UM dataset
        if: steps.cache-changes-um.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/summ_fishc_grow.zip "https://zenodo.org/api/records/15389937/files/CHANGES-UM/summ_fishc_grow-v1.0.0.zip/content"

      - name: Map species by waterbody
        run: |
          python3 scripts/map_species_by_waterbody.py \
            --regs data/regs.json \
            --survey-zip /tmp/summ_fishc_grow.zip \
            --inject
          cp data/regs.json public/data/regs.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
